}

query GetConsultation($id: UUID!) @auth(level: USER) {
  consultations(
    where: {
      id: { eq: $id }
      clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } }
      deletedAt: { isNull: true }
    }
    limit: 1
  ) {
    id
    clinicId
    patientId
    professionalId
    appointmentId
    specialtyId
    consultationType
    consultedAt
    nextVisitAt
    reason
    currentIllness
    physicalExam
    functionalExam
    studies
    diagnosisNotes
    treatmentPlan
    evolution
    plan
    notes
    vitals
    status
    signedAt
    createdAt
    updatedAt
    patient {
      fullName
      recordNumber
      birthDate
      sex
      allergiesNotes
    }
    professional {
      fullName
    }
    consultationDiagnoses_on_consultation(orderBy: [{ diagnosedAt: ASC }]) {
      id
      cie10Code
      diagnosisText
      diagnosisType
      notes
      diagnosedAt
    }
    prescriptions_on_consultation(orderBy: [{ issuedAt: ASC }]) {
      legacyId
      prescriptionItems_on_prescription(orderBy: [{ sortOrder: ASC }]) {
        medicationName
        presentation
        dose
        frequency
        duration
        quantity
        instructions
        sortOrder
      }
    }
  }
}

query SearchCie10($q: String!) @auth(level: USER, insecureReason: "Catálogo CIE-10 público y compartido") {
  cie10Codes(
    where: { _or: [{ code: { contains: $q } }, { description: { contains: $q } }] }
    orderBy: [{ code: ASC }]
    limit: 20
  ) {
    code
    description
    chapter
    category
  }
}

query GetCatalogs @auth(level: USER) {
  users(where: { firebaseUid: { eq_expr: "auth.uid" }, isActive: { eq: true } }) {
    clinic {
      professionals_on_clinic(where: { isActive: { eq: true } }, orderBy: [{ fullName: ASC }]) {
        id
        fullName
        licenseNumber
        defaultOfficeId
      }
      offices_on_clinic(where: { isActive: { eq: true } }, orderBy: [{ name: ASC }]) {
        id
        code
        name
        location
      }
      specialties_on_clinic(where: { isActive: { eq: true } }, orderBy: [{ name: ASC }]) {
        id
        code
        name
      }
      consultationReasons_on_clinic(where: { isActive: { eq: true } }, orderBy: [{ name: ASC }]) {
        id
        code
        name
      }
    }
  }
}
