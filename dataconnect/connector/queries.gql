query GetSession @auth(level: USER) {
  users(where: { firebaseUid: { eq_expr: "auth.uid" }, isActive: { eq: true } }) {
    id
    firebaseUid
    username
    email
    fullName
    role
    mustChangePassword
    isActive
    clinic {
      id
      code
      name
      timezone
      currency
    }
    professional_on_user {
      id
      fullName
      licenseNumber
    }
  }
}

query ListPatients($q: String!, $limit: Int!, $offset: Int!) @auth(level: USER) {
  patients(
    where: {
      _and: [
        { clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } } }
        { deletedAt: { isNull: true } }
        {
          _or: [
            { fullName: { contains: $q } }
            { searchText: { contains: $q } }
            { documentNumber: { contains: $q } }
            { recordNumber: { contains: $q } }
          ]
        }
      ]
    }
    orderBy: [{ searchText: ASC }]
    limit: $limit
    offset: $offset
  ) {
    id
    recordNumber
    documentType
    documentNumber
    documentVerified
    fullName
    firstName
    lastName
    birthDate
    ageOverride
    birthDateEstimated
    deceased
    sex
    maritalStatus
    bloodType
    nationality
    birthPlace
    address
    city
    state
    country
    phone
    mobile
    email
    occupation
    isPrivate
    photoUrl
    allergiesNotes
    currentDiagnosisSummary
    isSuspended
    suspensionReason
    notes
    createdAt
    updatedAt
    appointments_on_patient(
      where: { status: { in: ["programada", "confirmada", "en_espera"] }, startsAt: { ge_expr: "request.time" } }
      orderBy: [{ startsAt: ASC }]
      limit: 1
    ) {
      startsAt
    }
  }
}

query CountPatients($q: String!) @auth(level: USER) {
  patients(
    where: {
      _and: [
        { clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } } }
        { deletedAt: { isNull: true } }
        {
          _or: [
            { fullName: { contains: $q } }
            { searchText: { contains: $q } }
            { documentNumber: { contains: $q } }
            { recordNumber: { contains: $q } }
          ]
        }
      ]
    }
    limit: 1
  ) {
    _count
  }
}

query ListPatientsByTerms($q1: String! = "", $q2: String! = "", $q3: String! = "", $q4: String! = "", $q5: String! = "", $q6: String! = "", $limit: Int!, $offset: Int!) @auth(level: USER) {
  patients(
    where: {
      _and: [
        { clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } } }
        { deletedAt: { isNull: true } }
        { searchText: { contains: $q1 } }
        { searchText: { contains: $q2 } }
        { searchText: { contains: $q3 } }
        { searchText: { contains: $q4 } }
        { searchText: { contains: $q5 } }
        { searchText: { contains: $q6 } }
      ]
    }
    orderBy: [{ searchText: ASC }]
    limit: $limit
    offset: $offset
  ) {
    id recordNumber documentType documentNumber documentVerified fullName firstName lastName birthDate ageOverride birthDateEstimated deceased sex maritalStatus bloodType nationality birthPlace address city state country phone mobile email occupation isPrivate photoUrl allergiesNotes currentDiagnosisSummary isSuspended suspensionReason notes createdAt updatedAt
    appointments_on_patient(where: { status: { in: ["programada", "confirmada", "en_espera"] }, startsAt: { ge_expr: "request.time" } }, orderBy: [{ startsAt: ASC }], limit: 1) { startsAt }
  }
}

query CountPatientsByTerms($q1: String! = "", $q2: String! = "", $q3: String! = "", $q4: String! = "", $q5: String! = "", $q6: String! = "") @auth(level: USER) {
  patients(where: { _and: [
    { clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } } }
    { deletedAt: { isNull: true } }
    { searchText: { contains: $q1 } }
    { searchText: { contains: $q2 } }
    { searchText: { contains: $q3 } }
    { searchText: { contains: $q4 } }
    { searchText: { contains: $q5 } }
    { searchText: { contains: $q6 } }
  ] }, limit: 1) { _count }
}

query GetPatient($id: UUID!) @auth(level: USER) {
  patients(
    where: {
      id: { eq: $id }
      clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } }
      deletedAt: { isNull: true }
    }
    limit: 1
  ) {
    id
    recordNumber
    documentType
    documentNumber
    documentVerified
    fullName
    firstName
    lastName
    birthDate
    ageOverride
    birthDateEstimated
    deceased
    deathDate
    sex
    maritalStatus
    bloodType
    nationality
    birthPlace
    address
    city
    state
    country
    phone
    mobile
    email
    occupation
    isPrivate
    photoUrl
    allergiesNotes
    currentDiagnosisSummary
    guardianName
    guardianPhone
    religion
    isSuspended
    suspensionReason
    notes
    createdAt
    updatedAt
    patientHistories_on_patient(orderBy: [{ recordedAt: DESC }]) {
      id
      category
      description
      details
      onsetDate
      isActive
      recordedAt
    }
    consultations_on_patient(
      where: { deletedAt: { isNull: true } }
      orderBy: [{ consultedAt: DESC }]
      limit: 10000
    ) {
      id
      consultedAt
      status
      reason
      currentIllness
      treatmentPlan
      signedAt
      updatedAt
      professional {
        fullName
      }
    }
    appointments_on_patient(
      where: { status: { in: ["programada", "confirmada", "en_espera"] }, startsAt: { ge_expr: "request.time" } }
      orderBy: [{ startsAt: ASC }]
      limit: 5
    ) {
      id
      startsAt
      endsAt
      status
      reason
      professional {
        fullName
      }
    }
  }
}

query ListAgenda($start: Timestamp!, $end: Timestamp!) @auth(level: USER) {
  appointments(
    where: {
      clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } }
      startsAt: { ge: $start, lt: $end }
    }
    orderBy: [{ startsAt: ASC }]
    limit: 200
  ) {
    id
    patientId
    professionalId
    startsAt
    endsAt
    durationMinutes
    reason
    status
    notes
    patient {
      fullName
      email
      recordNumber
      phone
    }
    professional {
      fullName
    }
    specialty {
      name
    }
    office {
      name
    }
    consultation_on_appointment {
      id
    }
  }
}

query ListConsultations @auth(level: USER) {
  consultations(
    where: {
      clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } }
      deletedAt: { isNull: true }
    }
    orderBy: [{ consultedAt: DESC }]
    limit: 60
  ) {
    id
    consultedAt
    status
    reason
    currentIllness
    treatmentPlan
    signedAt
    updatedAt
    patient {
      fullName
      recordNumber
    }
    professional {
      fullName
    }
  }
}

query GetConsultation($id: UUID!) @auth(level: USER) {
  consultations(
    where: {
      id: { eq: $id }
      clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } }
      deletedAt: { isNull: true }
    }
    limit: 1
  ) {
    id
    clinicId
    patientId
    professionalId
    appointmentId
    specialtyId
    consultationType
    consultedAt
    nextVisitAt
    reason
    currentIllness
    physicalExam
    functionalExam
    studies
    evolutionText
    studiesText
    prescriptionText
    diagnosisNotes
    treatmentPlan
    evolution
    plan
    notes
    vitals
    status
    signedAt
    createdAt
    updatedAt
    patient {
      fullName
      email
      recordNumber
      birthDate
      sex
      allergiesNotes
    }
    professional {
      fullName
    }
    prescriptions_on_consultation(orderBy: [{ issuedAt: ASC }]) {
      legacyId
      prescriptionItems_on_prescription(orderBy: [{ sortOrder: ASC }]) {
        medicationName
        presentation
        dose
        frequency
        duration
        quantity
        instructions
        sortOrder
      }
    }
  }
}

query ListPatientStudies($patientId: UUID!, $limit: Int!, $offset: Int!) @auth(level: USER) {
  patientStudies(
    where: {
      _and: [
        { patient: { id: { eq: $patientId } } }
        { clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } } }
      ]
    }
    orderBy: [{ performedAt: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    studyType
    studyName
    performedAt
    resultSummary
    resultText
    metadata
    consultation { id }
    professional { fullName }
  }
}

query GetCatalogs @auth(level: USER) {
  users(where: { firebaseUid: { eq_expr: "auth.uid" }, isActive: { eq: true } }) {
    clinic {
      professionals_on_clinic(where: { isActive: { eq: true } }, orderBy: [{ fullName: ASC }]) {
        id
        fullName
        licenseNumber
        defaultOfficeId
      }
      offices_on_clinic(where: { isActive: { eq: true } }, orderBy: [{ name: ASC }]) {
        id
        code
        name
        location
      }
      specialties_on_clinic(where: { isActive: { eq: true } }, orderBy: [{ name: ASC }]) {
        id
        code
        name
      }
      consultationReasons_on_clinic(where: { isActive: { eq: true } }, orderBy: [{ name: ASC }]) {
        id
        code
        name
      }
    }
  }
}

query ClinicReports($from: Timestamp!, $to: Timestamp!, $limit: Int!, $offset: Int!) @auth(level: USER) {
  consultations(
    where: {
      _and: [
        { clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } } }
        { deletedAt: { isNull: true } }
        { consultedAt: { ge: $from } }
        { consultedAt: { le: $to } }
      ]
    }
    orderBy: [{ consultedAt: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    consultedAt
    reason
    professional { fullName }
    patient { fullName recordNumber sex birthDate }
  }
  patients(
    where: {
      _and: [
        { clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } } }
        { deletedAt: { isNull: true } }
        { createdAt: { ge: $from } }
        { createdAt: { le: $to } }
      ]
    }
    orderBy: [{ createdAt: DESC }]
    limit: $limit
    offset: $offset
  ) {
    id
    createdAt
    sex
    birthDate
  }
}
