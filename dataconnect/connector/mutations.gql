  $physicalExam: String
  $functionalExam: String
  $studies: String
  $diagnosisNotes: String
  $treatmentPlan: String
  $evolution: String
  $plan: String
  $notes: String
  $vitals: Any!
) @auth(level: USER) @transaction {
  consultation_update(
    first: {
      where: {
        id: { eq: $id }
        clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } }
        deletedAt: { isNull: true }
      }
    }
    data: {
      nextVisitAt: $nextVisitAt
      reason: $reason
      currentIllness: $currentIllness
      physicalExam: $physicalExam
      functionalExam: $functionalExam
      studies: $studies
      diagnosisNotes: $diagnosisNotes
