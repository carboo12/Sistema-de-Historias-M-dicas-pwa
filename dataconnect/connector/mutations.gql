mutation LinkCurrentUser @auth(level: USER_EMAIL_VERIFIED) @transaction {
  user_update(
    first: {
      where: {
        email: { eq_expr: "auth.token.email" }
        firebaseUid: { isNull: true }
        isActive: { eq: true }
      }
      orderBy: [{ createdAt: ASC }]
    }
    data: { firebaseUid_expr: "auth.uid" }
  ) @check(message: "No se encontró un usuario activo con este correo")
}

mutation CreatePatient(
  $clinicId: UUID!
  $createdById: UUID!
  $recordNumber: String!
  $documentType: String
  $documentNumber: String
  $documentVerified: Boolean!
  $fullName: String!
  $firstName: String
  $lastName: String
  $birthDate: Date
  $ageOverride: Int
  $birthDateEstimated: Boolean!
  $sex: String!
  $maritalStatus: String!
  $bloodType: String
  $nationality: String
  $birthPlace: String
  $address: String
  $city: String
  $state: String
  $country: String
  $phone: String
  $mobile: String
  $email: String
  $occupation: String
  $isPrivate: Boolean!
  $allergiesNotes: String
  $currentDiagnosisSummary: String
  $notes: String
  $isSuspended: Boolean!
  $suspensionReason: String
) @auth(level: USER) @transaction {
  user_update(
    first: {
      where: {
        id: { eq: $createdById }
        firebaseUid: { eq_expr: "auth.uid" }
        clinic: { id: { eq: $clinicId } }
        isActive: { eq: true }
      }
    }
    data: { lastLoginAt_expr: "request.time" }
  ) @check(message: "El usuario no pertenece a esta clínica")
  patient_insert(
    data: {
      clinicId: $clinicId
      recordNumber: $recordNumber
      documentType: $documentType
      documentNumber: $documentNumber
      documentVerified: $documentVerified
      fullName: $fullName
      firstName: $firstName
      lastName: $lastName
      birthDate: $birthDate
      ageOverride: $ageOverride
      birthDateEstimated: $birthDateEstimated
      sex: $sex
      maritalStatus: $maritalStatus
      bloodType: $bloodType
      nationality: $nationality
      birthPlace: $birthPlace
      address: $address
      city: $city
      state: $state
      country: $country
      phone: $phone
      mobile: $mobile
      email: $email
      occupation: $occupation
      isPrivate: $isPrivate
      allergiesNotes: $allergiesNotes
      currentDiagnosisSummary: $currentDiagnosisSummary
      notes: $notes
      isSuspended: $isSuspended
      suspensionReason: $suspensionReason
      createdById: $createdById
    }
  )
}

