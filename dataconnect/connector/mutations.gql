mutation SignConsultation($id: UUID!) @auth(level: USER) @transaction {
  consultation_update(
    first: {
      where: {
        id: { eq: $id }
        clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } }
        status: { eq: "borrador" }
        deletedAt: { isNull: true }
      }
    }
    data: {
      status: "firmada"
      signedAt_expr: "request.time"
      signedById_expr: "auth.uid"
    }
  ) @check(message: "No se encontró una consulta en borrador para firmar")
}

