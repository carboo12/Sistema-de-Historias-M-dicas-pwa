mutation UpdateAppointment(
  $id: UUID!
  $startsAt: Timestamp!
  $endsAt: Timestamp!
  $durationMinutes: Int!
  $reason: String
  $notes: String
  $status: String!
) @auth(level: USER) @transaction {
  appointment_update(
    first: {
      where: {
        id: { eq: $id }
        clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } }
        status: { ne: "cancelada" }
      }
    }
    data: {
      startsAt: $startsAt
      endsAt: $endsAt
      durationMinutes: $durationMinutes
      reason: $reason
      notes: $notes
      status: $status
    }
  ) @check(message: "No se encontró la cita activa en esta clínica")
}

