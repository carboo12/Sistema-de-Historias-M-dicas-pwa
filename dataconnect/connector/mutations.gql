mutation UpdateConsultation(
  $id: UUID!
  $nextVisitAt: Timestamp
  $reason: String
  $currentIllness: String
  $physicalExam: String
  $functionalExam: String
  $studies: String
  $evolutionText: String
  $studiesText: String
  $prescriptionText: String
  $diagnosisNotes: String
  $treatmentPlan: String
  $evolution: String
  $plan: String
  $notes: String
  $vitals: Any!
) @auth(level: USER) @transaction {
  consultation_update(
    first: {
      where: {
        id: { eq: $id }
        clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } }
        status: { eq: "borrador" }
        deletedAt: { isNull: true }
      }
    }
    data: {
      nextVisitAt: $nextVisitAt
      reason: $reason
      currentIllness: $currentIllness
      physicalExam: $physicalExam
      functionalExam: $functionalExam
      studies: $studies
      evolutionText: $evolutionText
      studiesText: $studiesText
      prescriptionText: $prescriptionText
      diagnosisNotes: $diagnosisNotes
      treatmentPlan: $treatmentPlan
      evolution: $evolution
      plan: $plan
      notes: $notes
      vitals: $vitals
    }
  ) @check(message: "No se encontró la consulta en esta clínica")
}

mutation DeleteConsultation($id: UUID!) @auth(level: USER) @transaction {
  consultation_update(
    first: {
      where: {
        id: { eq: $id }
        clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } }
        status: { eq: "borrador" }
        deletedAt: { isNull: true }
      }
    }
    data: { deletedAt_expr: "request.time" }
  ) @check(message: "Solo se pueden eliminar consultas en borrador")
}

mutation SignConsultation($id: UUID!, $signedById: UUID!) @auth(level: USER) @transaction {
  user_update(
    first: {
      where: {
        id: { eq: $signedById }
        firebaseUid: { eq_expr: "auth.uid" }
        isActive: { eq: true }
      }
    }
    data: { lastLoginAt_expr: "request.time" }
  ) @check(message: "El usuario autenticado no está activo")
  consultation_update(
    first: {
      where: {
        id: { eq: $id }
        clinic: { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } }
        status: { eq: "borrador" }
        deletedAt: { isNull: true }
      }
    }
    data: {
      status: "firmada"
      signedAt_expr: "request.time"
      signedById: $signedById
    }
  ) @check(message: "No se encontró una consulta en borrador para firmar")
}

mutation CreatePatientStudy(
  $clinicId: UUID!
  $patientId: UUID!
  $consultationId: UUID @retired
  $professionalId: UUID
  $studyType: String!
  $studyName: String!
  $performedAt: Timestamp!
  $resultSummary: String
  $resultText: String
  $metadata: Any!
) @auth(level: USER) @transaction {
  patient_update(
    first: {
      where: {
        id: { eq: $patientId }
        clinic: {
          _and: [
            { id: { eq: $clinicId } }
            { users_on_clinic: { exist: { firebaseUid: { eq_expr: "auth.uid" } } } }
          ]
        }
      }
    }
    data: { updatedAt_expr: "request.time" }
  ) @check(message: "No se encontró el paciente en esta clínica")
  patientStudy_insert(data: {
    clinicId: $clinicId
    patientId: $patientId
    professionalId: $professionalId
    studyType: $studyType
    studyName: $studyName
    performedAt: $performedAt
    status: "completado"
    resultSummary: $resultSummary
    resultText: $resultText
    metadata: $metadata
  })
}
